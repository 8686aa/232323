name: Build unsigned IPA

# 产出**未签名**的 .ipa，供「全能签」等自签工具在设备上重签名。
#
# 为什么需要未签名包：
#   自签工具要自己拿证书去签，如果包已经被别的证书签过，重签会失败或残留冲突。
#   所以这里用 CODE_SIGNING_ALLOWED=NO 跳过签名，并把可能残留的
#   _CodeSignature 目录删掉，保证是一个干净的未签名 IPA。
#
# 调试说明：
#   本工作流会把完整的构建日志回推到 ci-logs/ 目录（提交信息带 [skip ci]，
#   所以不会递归触发）。这样在拿不到 Actions 日志下载权限时，
#   也能通过仓库内容直接读到编译错误。
#
# ⚠️ 两个必须注意的坑（都实际踩过）：
#
#   1. 工程文件格式版本不匹配（首次构建失败的原因）
#      XcodeGen 生成的是 objectVersion 77（Xcode 16 的工程格式），
#      而 macos-14 镜像默认 Xcode 是 15.4，直接报：
#        could not read project "UdpCast.xcodeproj"
#        it is in a future Xcode project file format (77)
#      对策（两步都做，双保险）：
#        ① 显式切换到镜像里最新的 Xcode
#        ② 生成后把 objectVersion 归一化到 56 —— Xcode 14/15/16 都能打开的保守值
#
#   2. 产物目录名不能硬编码
#      早期版本写死了 build/Build/Products/Release-iphoneos。
#      一旦 -configuration 没正确传进去，目录名就不是 Release-*，
#      后续步骤会找不到 app。改为用 -showBuildSettings 动态取 BUILT_PRODUCTS_DIR。

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'ci-logs/**'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UdpCast (unsigned)
    runs-on: macos-14
    timeout-minutes: 40

    env:
      SCHEME: UdpCast
      PROJECT: UdpCast.xcodeproj
      CONFIG: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -e
          echo "== 镜像里可用的 Xcode =="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "== 当前默认 =="
          xcode-select -p

          # 选版本号最大的那个（sort -V 按版本排序）
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "切换为: $LATEST"
            sudo xcode-select -s "$LATEST"
          else
            echo "未找到 /Applications/Xcode*.app，沿用默认"
          fi

          echo "== 切换后 =="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -e
          xcodegen generate
          echo "== 生成的文件 =="
          ls -la

      - name: Normalize project format
        working-directory: ios
        run: |
          set -e
          PBX="$PROJECT/project.pbxproj"
          test -f "$PBX" || { echo "找不到 $PBX"; exit 1; }

          echo "== 归一化前 =="
          grep -oE 'objectVersion = [0-9]+;' "$PBX" | head -3 || true
          grep -oE 'compatibilityVersion = "[^"]*";' "$PBX" | head -3 || true

          # XcodeGen 会按最新 Xcode 的格式生成，两个字段都要一起降：
          #   objectVersion        77 = Xcode 16 格式，Xcode 15 直接拒绝打开
          #   compatibilityVersion "Xcode 16.0" 同样会让旧 Xcode 报错
          # 统一降到 Xcode 14 的水平：14 / 15 / 16 都能打开。
          # macOS 的 sed 就地修改需要 -i '' 的写法。
          sed -i '' -E \
            -e 's/objectVersion = [0-9]+;/objectVersion = 56;/g' \
            -e 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/g' \
            "$PBX"

          echo "== 归一化后 =="
          grep -oE 'objectVersion = [0-9]+;' "$PBX" | head -3 || true
          grep -oE 'compatibilityVersion = "[^"]*";' "$PBX" | head -3 || true

          echo "== 工程里的 target / scheme / 配置 =="
          xcodebuild -list -project "$PROJECT"

      - name: Build (no code signing)
        id: build
        working-directory: ios
        continue-on-error: true
        run: |
          mkdir -p /tmp/ci
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build > /tmp/ci/build.log 2>&1
          rc=$?
          echo "xcodebuild 退出码: $rc"
          echo "== 日志尾部 =="
          tail -100 /tmp/ci/build.log
          exit $rc

      - name: Locate products
        id: locate
        if: steps.build.outcome == 'success'
        working-directory: ios
        continue-on-error: true
        run: |
          # 关键：-showBuildSettings 必须带上与 build 完全相同的 -derivedDataPath。
          # 不加的话它会返回默认的 ~/Library/Developer/Xcode/DerivedData/... ，
          # 而实际产物在 ./build/ 下，后续步骤就会找不到 app。
          DIR=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
                  -configuration "$CONFIG" -sdk iphoneos \
                  -derivedDataPath build \
                  -showBuildSettings 2>/dev/null \
                | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
          echo "BUILT_PRODUCTS_DIR=$DIR"

          # 自检：目录必须真实存在，否则退回在 build/ 里搜
          if [ -z "$DIR" ] || [ ! -d "$DIR" ]; then
            FOUND=$(find build/Build/Products -maxdepth 1 -type d -name '*-iphoneos' 2>/dev/null | head -1)
            echo "路径不存在或为空，回退查找得到: $FOUND"
            DIR="$FOUND"
          fi

          echo "最终使用: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verify products
        id: verify
        if: steps.build.outcome == 'success'
        working-directory: ios
        continue-on-error: true
        run: |
          mkdir -p /tmp/ci
          {
            set -e
            DIR="${{ steps.locate.outputs.dir }}"
            APP="$DIR/$SCHEME.app"

            # 双保险：万一路径还是不对，直接在 build/ 里搜同名 app
            if [ ! -d "$APP" ]; then
              echo "在 $APP 没找到，改为搜索 build/ 目录…"
              FOUND=$(
                find build/Build/Products -maxdepth 2 -type d -name "$SCHEME.app" 2>/dev/null | head -1
              )
              if [ -n "$FOUND" ]; then
                APP="$FOUND"
                DIR=$(dirname "$FOUND")
              fi
            fi

            echo "== 目标 app: $APP =="

            # 把 build/Products 的完整结构打出来，便于下次对照
            echo "== build/Build/Products 结构 =="
            find build/Build/Products -maxdepth 2 2>/dev/null | head -20 || true

            find "$APP" -maxdepth 3 2>&1 | head -40

            test -d "$APP" || { echo "错误：没有生成 $SCHEME.app"; exit 1; }

            # 广播扩展必须被嵌进去，否则 ReplayKit 列表里不会出现「UDP投屏」
            test -d "$APP/PlugIns/BroadcastExtension.appex" \
              || { echo "错误：广播扩展没有被嵌入，IPA 不可用"; exit 1; }

            echo "== 扩展的 Info.plist 关键项 =="
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
              "$APP/PlugIns/BroadcastExtension.appex/Info.plist"
            echo -n "UdpCastDefaultHost = "
            /usr/libexec/PlistBuddy -c 'Print :UdpCastDefaultHost' \
              "$APP/PlugIns/BroadcastExtension.appex/Info.plist" || echo "(缺失)"

            echo "== 扩展二进制架构 =="
            lipo -info "$APP/PlugIns/BroadcastExtension.appex/BroadcastExtension"

            echo "APP_PATH=$APP" > /tmp/ci/app_path
            echo "校验通过"
          } > /tmp/ci/verify.log 2>&1
          cat /tmp/ci/verify.log

      - name: Package unsigned IPA
        id: package
        if: steps.build.outcome == 'success' && steps.verify.outcome == 'success'
        working-directory: ios
        continue-on-error: true
        run: |
          {
            set -e
            APP=$(cut -d= -f2- /tmp/ci/app_path)
            echo "打包 $APP"

            rm -rf Payload UdpCast-unsigned.ipa
            mkdir -p Payload
            cp -R "$APP" Payload/

            # 彻底剥掉签名痕迹，保证是干净的未签名包
            find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} +
            find Payload -name 'CodeResources' -type f -delete
            find Payload -name '*.mobileprovision' -type f -delete

            zip -qry UdpCast-unsigned.ipa Payload
            rm -rf Payload

            echo "== 产物 =="
            ls -la UdpCast-unsigned.ipa
            echo "== IPA 内结构 =="
            unzip -l UdpCast-unsigned.ipa | head -30

            if unzip -l UdpCast-unsigned.ipa | grep -q '_CodeSignature'; then
              echo "错误：IPA 里仍有 _CodeSignature"
              exit 1
            fi
            echo "干净：未签名"
          } > /tmp/ci/package.log 2>&1
          cat /tmp/ci/package.log

      # ---- 把日志回推到仓库，便于在没有日志下载权限时排查 ----
      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          {
            echo "# CI 构建日志"
            echo
            echo "- 运行: #${{ github.run_number }}"
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 事件: ${{ github.event_name }}"
            echo "- 结果: build=${{ steps.build.outcome }} verify=${{ steps.verify.outcome }} package=${{ steps.package.outcome }}"
            echo
            echo "## 工具链"
            echo '```'
            xcodebuild -version 2>&1 || true
            echo "xcode-select: $(xcode-select -p 2>&1 || true)"
            echo '```'
            echo
            echo "## Build"
            echo '```'
            cat /tmp/ci/build.log 2>/dev/null || echo "(无 build 日志)"
            echo '```'
            echo
            echo "## Verify"
            echo '```'
            cat /tmp/ci/verify.log 2>/dev/null || echo "(未执行)"
            echo '```'
            echo
            echo "## Package"
            echo '```'
            cat /tmp/ci/package.log 2>/dev/null || echo "(未执行)"
            echo '```'
          } > ci-logs/last-build.md

          echo "日志大小: $(wc -c < ci-logs/last-build.md) 字节"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/last-build.md
          if git diff --cached --quiet; then
            echo "日志无变化，跳过提交"
          else
            git commit -m "ci: 构建日志 #${{ github.run_number }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || \
              git push origin "HEAD:${{ github.event.repository.default_branch }}" || true
          fi

      - name: Upload artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UdpCast-unsigned-ipa
          path: ios/UdpCast-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: ios/UdpCast-unsigned.ipa
          generate_release_notes: true
          body: |
            未签名 IPA，请使用「全能签」等自签工具导入后重签名安装。

            使用前请在 PC 上运行 `receiver/receiver.py`。
            若签名未提供 App Groups 权限，广播扩展会自动在局域网搜索接收端。

      - name: Fail if build broken
        if: steps.build.outcome != 'success' || steps.verify.outcome == 'failure' || steps.package.outcome == 'failure'
        run: |
          echo "构建链路失败，详情见 ci-logs/last-build.md"
          exit 1
