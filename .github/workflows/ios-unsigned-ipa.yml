name: Build unsigned IPA

# 产出**未签名**的 .ipa，供「全能签」等自签工具在设备上重签名。
#
# 为什么需要未签名包：
#   自签工具要自己拿证书去签，如果包已经被别的证书签过，重签会失败或残留冲突。
#   所以这里用 CODE_SIGNING_ALLOWED=NO 跳过签名，并把可能残留的
#   _CodeSignature 目录删掉，保证是一个干净的未签名 IPA。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build UdpCast (unsigned)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          ls -la

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project UdpCast.xcodeproj \
            -scheme UdpCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tail -60

      - name: Verify products
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/UdpCast.app"
          echo "== app 目录结构 =="
          find "$APP" -maxdepth 3 | head -40

          test -d "$APP" || { echo "::error::没有生成 UdpCast.app"; exit 1; }

          # 广播扩展必须被嵌进去，否则 ReplayKit 列表里不会出现「UDP投屏」
          test -d "$APP/PlugIns/BroadcastExtension.appex" \
            || { echo "::error::广播扩展没有被嵌入，IPA 不可用"; exit 1; }

          echo "== 扩展的 Info.plist 关键项 =="
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "$APP/PlugIns/BroadcastExtension.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UdpCastDefaultHost' \
            "$APP/PlugIns/BroadcastExtension.appex/Info.plist" || true

          echo "== 扩展二进制架构 =="
          lipo -info "$APP/PlugIns/BroadcastExtension.appex/BroadcastExtension"

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/UdpCast.app"

          rm -rf Payload UdpCast-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/

          # 彻底剥掉签名痕迹，保证是干净的未签名包
          find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          find Payload -name 'CodeResources' -type f -delete
          find Payload -name '*.mobileprovision' -type f -delete
          find Payload -name 'embedded.mobileprovision' -type f -delete

          zip -qry UdpCast-unsigned.ipa Payload
          rm -rf Payload

          echo "== 产物 =="
          ls -la UdpCast-unsigned.ipa
          echo "== IPA 内结构 =="
          unzip -l UdpCast-unsigned.ipa | head -30
          echo "== 确认没有残留签名 =="
          if unzip -l UdpCast-unsigned.ipa | grep -q '_CodeSignature'; then
            echo "::error::IPA 里仍有 _CodeSignature"; exit 1
          fi
          echo "干净：未签名"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UdpCast-unsigned-ipa
          path: ios/UdpCast-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/UdpCast-unsigned.ipa
          generate_release_notes: true
          body: |
            未签名 IPA，请使用「全能签」等自签工具导入后重签名安装。

            使用前请在 PC 上运行 `receiver/receiver.py`。
            若签名未提供 App Groups 权限，广播扩展会自动在局域网搜索接收端。
